name: Reproduce manuscript results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify frozen release hashes
        run: python verify_release.py
      - name: Install recorded dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Recompute analyses and figures
        run: python reproduce.py
      - name: Show numerical verification
        if: always()
        run: python -c "from pathlib import Path; print(Path('checks/verification.json').read_text())"
      - name: Preserve numerical diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: numerical-diagnostics
          retention-days: 30
          path: |
            checks/verification.json
            checks/verification.csv
            checks/platform_differences.csv
            checks/logs/
            research/inputs/Final/outputs/*.csv
            research/inputs/Final/outputs/runs/*/parameters.json
            research/inputs/Final/outputs/runs/*/economic_parameters.json
            research/inputs/Final/outputs/runs/*/monthly.csv
            research/inputs/Final/outputs/runs/*/economic_details.csv
            research/inputs/Final/outputs/runs/*/states.npz
            research/outputs/refinement.csv
            research/outputs/aom.csv
            research/outputs/mortality_brackets.csv
