name: Reproduce manuscript results

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify frozen release hashes
        run: python verify_release.py
      - name: Install recorded dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Recompute analyses and figures
        run: python reproduce.py
      - name: Show numerical verification
        run: python -c "from pathlib import Path; print(Path('checks/verification.json').read_text())"
